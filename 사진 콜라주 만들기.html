<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사진 콜라주 만들기</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1f1f1d;--mut:#77756f;--line:#dedbd3;--ac:#2f6fed;--acx:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232321;--tx:#f0eee8;--mut:#9a978f;--line:#3a3935;--ac:#6b9bff;--acx:#10131a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--card:#232321;--tx:#f0eee8;--mut:#9a978f;--line:#3a3935;--ac:#6b9bff;--acx:#10131a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:920px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:0 0 10px}
p.s{color:var(--mut);margin:0 0 18px;font-size:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:26px 12px;text-align:center;color:var(--mut);cursor:pointer}
.drop.on{border-color:var(--ac);color:var(--ac)}
.drop input{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px}
.th{position:relative;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.th.sel{border-color:var(--ac)}
.th img{display:block;width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer}
.th .n{position:absolute;top:4px;left:4px;background:var(--ac);color:var(--acx);font-size:12px;border-radius:99px;min-width:20px;text-align:center;padding:0 6px}
.th .bar{display:flex;justify-content:space-between;padding:2px 4px}
.th button{border:0;background:none;color:var(--tx);cursor:pointer;font-size:16px;padding:8px 12px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
label.f{display:flex;gap:8px;align-items:center;font-size:14px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer;font-family:inherit}
.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.hint{color:var(--mut);font-size:13px;margin-top:8px}
.out{overflow-x:auto;text-align:center}
canvas{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px}
.empty{color:var(--mut);font-size:14px;text-align:center;padding:12px}
</style>
</head>
<body>
<main>
<h1>사진 콜라주 만들기</h1>
<p class="s">사진을 원하는 만큼 올리고, 가로 또는 세로로 붙여보세요. 결과를 다시 목록에 넣으면 가로+세로를 섞은 콜라주도 만들 수 있어요.</p>

<section>
<h2>1. 사진 추가</h2>
<label class="drop" id="drop"><input type="file" id="file" accept="image/*" multiple>
탭해서 사진을 여러 장 한 번에 선택하세요<br><small>(PC에서는 끌어다 놓아도 돼요)</small></label>
<div class="grid" id="grid"></div>
<div class="hint" id="hint"></div>
</section>

<section>
<h2>2. 붙이기</h2>
<div class="row">
<label class="f">간격 <input type="range" id="gap" min="0" max="80" value="8"> <span id="gv">8</span>px</label>
<label class="f">배경색 <input type="color" id="bg" value="#ffffff"></label>
</div>
<div class="row" style="margin-top:12px">
<label class="f"><input type="checkbox" id="chain" disabled> 현재 결과에 이어 붙이기</label>
<label class="f">위치 <select id="pos"><option value="back">뒤 (오른쪽 / 아래)</option><option value="front">앞 (왼쪽 / 위)</option></select></label>
</div>
<div class="row" style="margin-top:12px">
<button class="btn p" id="bh">↔ 가로로 붙이기</button>
<button class="btn p" id="bv">↕ 세로로 붙이기</button>
</div>
<div class="row" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">
<label class="f">격자 <input type="text" id="gs" value="3*5" placeholder="가로*세로" style="width:80px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px"></label>
<label class="f"><select id="fit"><option value="cover">칸에 꽉 채우기(잘림)</option><option value="contain">사진 전체 보이기(여백)</option></select></label>
<button class="btn p" id="bg2">▦ 격자로 붙이기</button>
</div>
<div class="hint" id="gnote">가로*세로 칸 수를 입력하세요. 예) 3*5 → 가로 3칸, 세로 5줄. 사진은 순서대로 왼쪽 위부터 채워집니다.</div>
<div class="hint">사진을 클릭해 선택하면 선택한 사진만, 아무것도 선택하지 않으면 전체를 붙입니다. 순서는 ◀ ▶ 로 바꿔요.</div>
</section>

<section>
<h2>3. 결과</h2>
<div class="out" id="out"><div class="empty">아직 만든 콜라주가 없어요.</div></div>
<div class="row" id="acts" style="margin-top:12px;display:none;justify-content:center">
<button class="btn p" id="dl">PNG 저장</button>
<button class="btn" id="re">결과를 사진 목록에 추가</button>
<button class="btn" id="clr">결과 비우기</button>
</div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let photos=[],uid=0,result=null;
const MAX=8000;

function load(file){
  return new Promise(res=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>res({id:++uid,img,url,w:img.naturalWidth,h:img.naturalHeight,sel:false});
    img.onerror=()=>res(null);
    img.src=url;
  });
}
async function add(files){
  $('hint').textContent='사진 불러오는 중...';
  for(const f of [...files]){
    if(!f.type.startsWith('image/')&&!/\.(jpe?g|png|gif|webp|heic|heif|bmp)$/i.test(f.name))continue;
    const p=await load(f);
    if(p)photos.push(p);
  }
  render();
}
function render(){
  const g=$('grid');g.innerHTML='';
  photos.forEach((p,i)=>{
    const d=document.createElement('div');d.className='th'+(p.sel?' sel':'');
    const im=document.createElement('img');im.src=p.url;
    im.onclick=()=>{p.sel=!p.sel;render()};
    d.appendChild(im);
    if(p.sel){
      const n=document.createElement('span');n.className='n';
      n.textContent=photos.filter(q=>q.sel).indexOf(p)+1;d.appendChild(n);
    }
    const bar=document.createElement('div');bar.className='bar';
    [['◀',()=>move(i,-1)],['✕',()=>{photos.splice(i,1);render()}],['▶',()=>move(i,1)]].forEach(([t,fn])=>{
      const b=document.createElement('button');b.textContent=t;b.onclick=fn;bar.appendChild(b);
    });
    d.appendChild(bar);g.appendChild(d);
  });
  const s=photos.filter(p=>p.sel).length;
  $('hint').textContent=photos.length?`사진 ${photos.length}장` + (s?` · ${s}장 선택됨`:' · 선택 없음(전체 사용)'):'';
}
function move(i,d){
  const j=i+d;if(j<0||j>=photos.length)return;
  [photos[i],photos[j]]=[photos[j],photos[i]];render();
}
function combine(dir){
  const sel=photos.filter(p=>p.sel);let list=sel.length?sel:photos;
  if(result&&$('chain').checked){
    const base={img:result,w:result.width,h:result.height};
    list=$('pos').value==='front'?[...list,base]:[base,...list];
  }
  if(list.length<2){alert('붙이려면 사진이 2장 이상 필요해요. (이어 붙이기는 아래 목록에서 붙일 사진을 선택하세요.)');return}
  const gap=+$('gap').value,n=list.length;
  let W,H,items;
  if(dir==='h'){
    H=Math.min(...list.map(p=>p.h));
    items=list.map(p=>({p,w:p.w*H/p.h,h:H}));
    W=items.reduce((a,b)=>a+b.w,0)+gap*(n-1);
  }else{
    W=Math.min(...list.map(p=>p.w));
    items=list.map(p=>({p,w:W,h:p.h*W/p.w}));
    H=items.reduce((a,b)=>a+b.h,0)+gap*(n-1);
  }
  const k=Math.min(1,MAX/Math.max(W,H),Math.sqrt(16e6/(W*H)));
  const c=document.createElement('canvas');
  c.width=Math.round(W*k);c.height=Math.round(H*k);
  const x=c.getContext('2d');
  x.fillStyle=$('bg').value;x.fillRect(0,0,c.width,c.height);
  x.imageSmoothingQuality='high';
  let pos=0;
  items.forEach(it=>{
    const w=it.w*k,h=it.h*k;
    if(dir==='h'){x.drawImage(it.p.img,pos,0,w,h);pos+=w+gap*k}
    else{x.drawImage(it.p.img,0,pos,w,h);pos+=h+gap*k}
  });
  result=c;
  $('out').innerHTML='';$('out').appendChild(c);
  $('acts').style.display='flex';
  $('chain').disabled=false;$('chain').checked=true;
  c.scrollIntoView({behavior:'smooth',block:'nearest'});
}
$('file').onchange=e=>{add(e.target.files);e.target.value=''};
const dz=$('drop');
['dragover','dragenter'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('on')}));
['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('on')}));
dz.addEventListener('drop',e=>add(e.dataTransfer.files));
$('gap').oninput=e=>$('gv').textContent=e.target.value;
function gridCombine(){
  const m=$('gs').value.trim().match(/^(\d+)\s*[*xX×]\s*(\d+)$/);
  if(!m){alert('이렇게 입력하세요: 3*5 (가로*세로)');return}
  const cols=+m[1],rows=+m[2];
  if(cols<1||rows<1||cols*rows>400){alert('1 이상, 총 400칸 이하로 입력하세요.');return}
  const sel=photos.filter(p=>p.sel),list=sel.length?sel:photos;
  if(!list.length){alert('사진을 먼저 올려주세요.');return}
  const used=list.slice(0,cols*rows),gap=+$('gap').value;
  const asp=used[0].w/used[0].h;
  const cw=Math.min(...used.map(p=>Math.min(p.w,p.h*asp))),ch=cw/asp;
  const W=cw*cols+gap*(cols-1),H=ch*rows+gap*(rows-1);
  const k=Math.min(1,MAX/Math.max(W,H),Math.sqrt(16e6/(W*H)));
  const c=document.createElement('canvas');
  c.width=Math.round(W*k);c.height=Math.round(H*k);
  const x=c.getContext('2d');
  x.fillStyle=$('bg').value;x.fillRect(0,0,c.width,c.height);
  x.imageSmoothingQuality='high';
  used.forEach((p,i)=>{
    const dx=(i%cols)*(cw+gap)*k,dy=Math.floor(i/cols)*(ch+gap)*k,dw=cw*k,dh=ch*k;
    if($('fit').value==='cover'){
      const s=Math.max(cw/p.w,ch/p.h),sw=cw/s,sh=ch/s;
      x.drawImage(p.img,(p.w-sw)/2,(p.h-sh)/2,sw,sh,dx,dy,dw,dh);
    }else{
      const s=Math.min(cw/p.w,ch/p.h),w=p.w*s*k,h=p.h*s*k;
      x.drawImage(p.img,dx+(dw-w)/2,dy+(dh-h)/2,w,h);
    }
  });
  const miss=cols*rows-used.length,extra=list.length-used.length;
  $('gnote').textContent=`${cols}*${rows} 격자 완성 (사진 ${used.length}장 사용)`+(miss>0?` · 빈 칸 ${miss}개`:'')+(extra>0?` · 사진 ${extra}장은 칸이 모자라 제외됨`:'');
  result=c;
  $('out').innerHTML='';$('out').appendChild(c);
  $('acts').style.display='flex';
  $('chain').disabled=false;$('chain').checked=true;
  c.scrollIntoView({behavior:'smooth',block:'nearest'});
}
$('bg2').onclick=gridCombine;
$('bh').onclick=()=>combine('h');
$('bv').onclick=()=>combine('v');
$('dl').onclick=()=>{
  if(!result)return;
  result.toBlob(async b=>{
    const f=new File([b],'collage.png',{type:'image/png'});
    if(/Android|iPhone|iPad/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]})){
      try{await navigator.share({files:[f]});return}catch(e){if(e&&e.name==='AbortError')return}
    }
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='collage.png';
    document.body.appendChild(a);a.click();a.remove();
  });
};
$('clr').onclick=()=>{
  result=null;$('out').innerHTML='<div class="empty">아직 만든 콜라주가 없어요.</div>';
  $('acts').style.display='none';$('chain').checked=false;$('chain').disabled=true;
};
$('re').onclick=()=>{
  if(!result)return;
  result.toBlob(async b=>{
    const p=await load(new File([b],'collage.png',{type:'image/png'}));
    if(p){photos.push(p);render()}
  });
};
</script>
</body>
</html>
